# 토큰 발급만 확인하고 끝내는 프로파일.
# 웹서버를 띄우지 않아야 러너가 끝나는 즉시 프로세스가 종료된다.
spring:
  main:
    web-application-type: none
  # DB 는 이 확인에 필요 없다. MySQL 이 꺼져 있어도 토큰만 확인할 수 있게 한다.
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration

toss:
  auth:
    # 워밍업 러너가 먼저 발급해버리면 확인 로그가 두 번 찍힌다. 확인 러너에게 맡긴다.
    eager-init: false
